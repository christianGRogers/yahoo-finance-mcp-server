[project]
name = "yahoo-finance-mcp-server"
version = "0.1.0"
description = "An MCP server exposing the full Yahoo Finance data surface (via yfinance) to agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=1.2.0",
    "yfinance>=0.2.50",
    "pandas>=2.0.0",
]

[project.scripts]
yahoo-finance-mcp = "yahoo_finance_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yahoo_finance_mcp"]
