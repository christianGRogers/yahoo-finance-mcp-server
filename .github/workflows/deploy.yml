name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Branch/tag/sha to deploy"
        required: false
        default: "main"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Run deploy script
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PASSWORD: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          APP_PORT: "8081"
          REPO_URL: "https://github.com/${{ github.repository }}.git"
          GIT_REF: ${{ github.event.inputs.git_ref || 'main' }}
          # Raspberry Pi OS Bullseye ships Python 3.9; set the secret/var to
          # python3.11 there. Falls back to python3 (fine on Bookworm).
          PYTHON_BIN: ${{ vars.PYTHON_BIN || 'python3' }}
        run: |
          chmod +x deploy/deploy.sh
          ./deploy/deploy.sh
